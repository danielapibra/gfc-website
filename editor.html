<!doctype html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Editor — Golden Fight Club</title>
<link rel="icon" href="/favicon.ico?v=3" sizes="any">
<link href="https://fonts.googleapis.com/css2?family=Oswald:wght@400;600&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --ink:#0b0b0d; --panel:#18181c; --panel-2:#1f1f24;
    --line:rgba(246,242,233,.12); --line-fuerte:rgba(246,242,233,.22);
    --oro:#cda45c; --oro-2:#e4c377; --hueso:#f3eee2; --gris:#a6a2ad;
    --verde:#2e7d52; --rojo:#a33c3c;
  }
  *,*::before,*::after{box-sizing:border-box;margin:0;padding:0;}
  body{background:var(--ink);color:var(--hueso);font-family:Inter,system-ui,sans-serif;line-height:1.5;padding-bottom:6rem;}
  h1,h2,h3{font-family:Oswald,sans-serif;font-weight:600;letter-spacing:.04em;}
  .wrap{max-width:860px;margin:0 auto;padding:0 1.2rem;}

  header{position:sticky;top:0;z-index:10;background:rgba(11,11,13,.96);border-bottom:1px solid var(--line);padding:1rem 0;}
  header .wrap{display:flex;align-items:center;justify-content:space-between;gap:1rem;flex-wrap:wrap;}
  header h1{font-size:1.05rem;text-transform:uppercase;letter-spacing:.14em;color:var(--oro);}
  .acciones{display:flex;gap:.6rem;align-items:center;}

  button{font:inherit;cursor:pointer;border:none;font-family:Oswald,sans-serif;letter-spacing:.06em;text-transform:uppercase;font-size:.8rem;padding:.75em 1.3em;border-radius:3px;}
  .b-oro{background:var(--oro);color:#171105;font-weight:600;}
  .b-oro:hover{background:var(--oro-2);}
  .b-oro:disabled{opacity:.5;cursor:not-allowed;}
  .b-linea{background:transparent;color:var(--hueso);border:1px solid var(--line-fuerte);}
  .b-linea:hover{border-color:var(--oro);color:var(--oro);}
  .b-peligro{background:transparent;color:#e08b8b;border:1px solid rgba(200,80,80,.45);padding:.5em .9em;font-size:.72rem;}
  .b-peligro:hover{background:rgba(200,80,80,.15);}

  .aviso{padding:.9rem 1.1rem;border-radius:4px;margin:1rem 0;font-size:.92rem;}
  .aviso.ok{background:rgba(46,125,82,.18);border:1px solid var(--verde);}
  .aviso.mal{background:rgba(163,60,60,.18);border:1px solid var(--rojo);}
  .aviso.info{background:var(--panel);border:1px solid var(--line);color:var(--gris);}

  /* Entrada */
  #entrar{max-width:520px;margin:4rem auto;padding:2rem;background:var(--panel);border:1px solid var(--line);border-radius:6px;}
  #entrar h2{font-size:1.3rem;margin-bottom:.6rem;}
  #entrar p{color:var(--gris);font-size:.92rem;margin-bottom:1.2rem;}
  input[type=password],input[type=text],textarea,select{
    width:100%;background:var(--ink);border:1px solid var(--line-fuerte);color:var(--hueso);
    padding:.75em .9em;border-radius:3px;font:inherit;font-size:.95rem;
  }
  input:focus,textarea:focus,select:focus{outline:2px solid var(--oro);outline-offset:1px;border-color:transparent;}
  textarea{resize:vertical;min-height:4.5em;line-height:1.5;}

  /* Secciones */
  .seccion{background:var(--panel);border:1px solid var(--line);border-radius:6px;margin:1.2rem 0;overflow:hidden;}
  .seccion > summary{padding:1rem 1.2rem;cursor:pointer;font-family:Oswald,sans-serif;text-transform:uppercase;letter-spacing:.1em;font-size:.88rem;color:var(--oro);list-style:none;display:flex;justify-content:space-between;align-items:center;}
  .seccion > summary::-webkit-details-marker{display:none;}
  .seccion > summary::after{content:'+';font-size:1.2rem;color:var(--gris);}
  .seccion[open] > summary::after{content:'–';}
  .seccion > summary:hover{background:var(--panel-2);}
  .cuerpo{padding:0 1.2rem 1.2rem;display:flex;flex-direction:column;gap:1.1rem;}

  .campo label{display:block;font-size:.74rem;text-transform:uppercase;letter-spacing:.1em;color:var(--gris);margin-bottom:.35rem;font-family:Oswald,sans-serif;}
  .campo .contexto{font-size:.75rem;color:#6f6c76;margin-top:.3rem;}

  /* Fotos */
  .fotos{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:1rem;}
  .foto{background:var(--panel-2);border:1px solid var(--line);border-radius:4px;overflow:hidden;}
  .foto img{width:100%;aspect-ratio:1;object-fit:cover;display:block;}
  .foto .pie{padding:.6rem;display:flex;flex-direction:column;gap:.5rem;}
  .foto .nombre{font-size:.78rem;color:var(--gris);word-break:break-all;}
  .foto input[type=file]{display:none;}
  .foto label.subir{display:block;text-align:center;border:1px dashed var(--line-fuerte);padding:.5em;border-radius:3px;font-size:.72rem;cursor:pointer;font-family:Oswald,sans-serif;text-transform:uppercase;letter-spacing:.06em;}
  .foto label.subir:hover{border-color:var(--oro);color:var(--oro);}
  .foto.cambiada{border-color:var(--oro);}

  /* Eventos */
  .evento{border:1px solid var(--line);border-radius:4px;padding:1.1rem;display:flex;flex-direction:column;gap:.8rem;background:var(--panel-2);}
  .evento .fila{display:grid;grid-template-columns:1fr 1fr;gap:.8rem;}
  @media(max-width:600px){.evento .fila{grid-template-columns:1fr;}}
  .evento .cabeza{display:flex;justify-content:space-between;align-items:center;gap:1rem;}
  .evento .cabeza strong{font-family:Oswald,sans-serif;letter-spacing:.06em;font-size:.85rem;text-transform:uppercase;color:var(--hueso);}

  /* Barra de guardar */
  .barra{position:fixed;left:0;right:0;bottom:0;background:rgba(11,11,13,.97);border-top:1px solid var(--line);padding:1rem 0;z-index:20;}
  .barra .wrap{display:flex;justify-content:space-between;align-items:center;gap:1rem;flex-wrap:wrap;}
  .estado{font-size:.85rem;color:var(--gris);}
  .oculto{display:none !important;}
</style>
</head>
<body>

<!-- ============================================================
     EDITOR DE CONTENIDO
     Página aparte, no enlazada desde el sitio. Lee index.html desde
     GitHub, deja editar textos, fotos y eventos, y vuelve a guardar
     el archivo. No necesita servidor: habla directo con la API de
     GitHub usando un token que se guarda solo en este navegador.
     ============================================================ -->

<div id="entrar">
  <h2>Editor Golden Fight Club</h2>
  <p>Pega aquí tu llave de acceso. Queda guardada en este navegador; no hay que escribirla cada vez.</p>
  <input type="password" id="token" placeholder="github_pat_..." autocomplete="off">
  <div class="aviso info" style="margin-top:1rem">Si no tienes llave, pídesela a Daniela.</div>
  <button class="b-oro" id="btnEntrar" style="width:100%;margin-top:.4rem">Entrar</button>
  <div id="entrarAviso"></div>
</div>

<div id="app" class="oculto">
  <header>
    <div class="wrap">
      <h1>Editor · Golden Fight Club</h1>
      <div class="acciones">
        <a href="https://goldenfightclub.com" target="_blank" rel="noopener"><button class="b-linea">Ver la página</button></a>
        <button class="b-linea" id="btnSalir">Salir</button>
      </div>
    </div>
  </header>

  <div class="wrap">
    <div id="avisos"></div>
    <div id="contenido"></div>
  </div>

  <div class="barra">
    <div class="wrap">
      <span class="estado" id="estado">Sin cambios</span>
      <button class="b-oro" id="btnGuardar" disabled>Guardar y publicar</button>
    </div>
  </div>
</div>

<script>
/* ---------------------------------------------------------------
   Ajustes del repositorio
   --------------------------------------------------------------- */
const REPO = { duenio: 'danielapibra', nombre: 'gfc-website', rama: 'main' };
const API = `https://api.github.com/repos/${REPO.duenio}/${REPO.nombre}/contents`;

/* Qué se puede editar de la página. Cada entrada dice qué elementos
   buscar y cómo llamarlos en el editor. El editor no toca nada más. */
const EDITABLES = [
  { seccion:'Portada',        sel:'.hero h1 .line',        etiqueta:'Línea del titular' },
  { seccion:'Portada',        sel:'.hero p.lede',          etiqueta:'Texto de presentación' },
  { seccion:'Quiénes somos',  sel:'#nosotros .historia-copy p', etiqueta:'Párrafo' },
  { seccion:'Entrenamientos', sel:'#entrenamientos .lede', etiqueta:'Texto de introducción' },
  { seccion:'Entrenamientos', sel:'#entrenamientos .training-card h3', etiqueta:'Nombre' },
  { seccion:'Entrenamientos', sel:'#entrenamientos .training-card p',  etiqueta:'Descripción' },
  { seccion:'Horarios',       sel:'#horarios .lede',       etiqueta:'Texto de introducción' },
  { seccion:'Horarios',       sel:'#horarios .schedule-row .time span', etiqueta:'Horario' },
  { seccion:'Horarios',       sel:'#horarios .schedule-note', etiqueta:'Nota' },
  { seccion:'Clases',         sel:'#clases .lede',         etiqueta:'Texto de introducción' },
  { seccion:'Clases',         sel:'#clases .clase-item .hora', etiqueta:'Hora de clase' },
  { seccion:'Clases',         sel:'#clases .clases-nota',  etiqueta:'Nota' },
  { seccion:'Planes',         sel:'#planes .lede',         etiqueta:'Texto de introducción' },
  { seccion:'Planes',         sel:'#planes .plan-ribbon',  etiqueta:'Nombre del plan' },
  { seccion:'Planes',         sel:'#planes .plan-price',   etiqueta:'Precio' },
  { seccion:'Planes',         sel:'#planes .plan-features li', etiqueta:'Detalle del plan' },
  { seccion:'Galería',        sel:'#galeria .lede',        etiqueta:'Texto de introducción' },
  { seccion:'Galería',        sel:'#galeria .gallery-tile > span', etiqueta:'Nombre de la foto' },
  { seccion:'Ubicación',      sel:'#ubicacion .lede',      etiqueta:'Texto de introducción' },
  { seccion:'Ubicación',      sel:'#ubicacion .loc-row p', etiqueta:'Dato' },
  { seccion:'Reseñas',        sel:'#resenas .lede',        etiqueta:'Texto de introducción' },
];

let token = null;
let doc = null;        // el index.html como documento
let shaIndex = null;   // versión del archivo, para no pisar cambios de otros
let cambios = false;
const imagenesNuevas = new Map();   // ruta -> contenido base64

/* ---------------------------------------------------------------
   Utilidades
   --------------------------------------------------------------- */
const $ = (s, raiz=document) => raiz.querySelector(s);
const $$ = (s, raiz=document) => [...raiz.querySelectorAll(s)];

function avisar(texto, tipo='info', donde='#avisos'){
  const c = $(donde);
  if(!c) return;
  c.innerHTML = `<div class="aviso ${tipo}">${texto}</div>`;
  if(tipo === 'ok') setTimeout(()=>{ c.innerHTML = ''; }, 6000);
}

function marcarCambio(){
  cambios = true;
  $('#btnGuardar').disabled = false;
  $('#estado').textContent = 'Hay cambios sin publicar';
}

async function api(ruta, opciones={}){
  const r = await fetch(ruta, {
    ...opciones,
    headers: {
      'Authorization': `Bearer ${token}`,
      'Accept': 'application/vnd.github+json',
      ...(opciones.headers||{})
    }
  });
  if(!r.ok){
    const cuerpo = await r.text();
    throw new Error(`${r.status} — ${cuerpo.slice(0,200)}`);
  }
  return r.json();
}

// GitHub devuelve el contenido en base64; hay que decodificar respetando acentos
function deBase64(b64){
  const binario = atob(b64.replace(/\n/g,''));
  const bytes = Uint8Array.from(binario, c => c.charCodeAt(0));
  return new TextDecoder('utf-8').decode(bytes);
}
function aBase64(texto){
  const bytes = new TextEncoder().encode(texto);
  let binario = '';
  bytes.forEach(b => binario += String.fromCharCode(b));
  return btoa(binario);
}

/* ---------------------------------------------------------------
   Entrada
   --------------------------------------------------------------- */
$('#btnEntrar').addEventListener('click', entrar);
$('#token').addEventListener('keydown', e => { if(e.key==='Enter') entrar(); });

async function entrar(){
  const valor = $('#token').value.trim();
  if(!valor){ avisar('Escribe la llave de acceso.', 'mal', '#entrarAviso'); return; }
  token = valor;
  avisar('Comprobando…', 'info', '#entrarAviso');
  try{
    await cargarPagina();
    localStorage.setItem('gfc-token', token);
    $('#entrar').classList.add('oculto');
    $('#app').classList.remove('oculto');
  }catch(e){
    token = null;
    avisar('No se pudo entrar. Revisa que la llave sea correcta y no haya caducado.<br><small>'+e.message+'</small>', 'mal', '#entrarAviso');
  }
}

$('#btnSalir').addEventListener('click', ()=>{
  if(cambios && !confirm('Hay cambios sin publicar. ¿Salir de todos modos?')) return;
  localStorage.removeItem('gfc-token');
  location.reload();
});

/* ---------------------------------------------------------------
   Cargar y pintar
   --------------------------------------------------------------- */
async function cargarPagina(){
  const datos = await api(`${API}/index.html?ref=${REPO.rama}`);
  shaIndex = datos.sha;
  const html = deBase64(datos.content);
  doc = new DOMParser().parseFromString(html, 'text/html');
  pintar();
}

function pintar(){
  const cont = $('#contenido');
  cont.innerHTML = '';

  // Agrupar los campos por sección
  const porSeccion = new Map();
  for(const grupo of EDITABLES){
    const elementos = $$(grupo.sel, doc);
    if(!elementos.length) continue;
    if(!porSeccion.has(grupo.seccion)) porSeccion.set(grupo.seccion, []);
    elementos.forEach((el, i) => {
      porSeccion.get(grupo.seccion).push({ el, etiqueta: elementos.length>1 ? `${grupo.etiqueta} ${i+1}` : grupo.etiqueta });
    });
  }

  for(const [seccion, campos] of porSeccion){
    const det = document.createElement('details');
    det.className = 'seccion';
    det.innerHTML = `<summary>${seccion}</summary><div class="cuerpo"></div>`;
    const cuerpo = $('.cuerpo', det);
    campos.forEach(({el, etiqueta}) => cuerpo.appendChild(campoTexto(el, etiqueta)));
    cont.appendChild(det);
  }

  cont.appendChild(bloqueEventos());
  cont.appendChild(bloqueFotos());
}

// Muchos elementos llevan cosas dentro que NO se deben tocar: el "/mes" de
// los precios, los iconos de los planes, el enlace de las notas. Por eso se
// edita únicamente el trozo de texto suelto más largo, no el elemento entero.
function nodoTexto(el){
  const sueltos = [...el.childNodes].filter(n => n.nodeType === 3 && n.textContent.trim());
  if(!sueltos.length) return null;
  return sueltos.reduce((a,b) => b.textContent.trim().length > a.textContent.trim().length ? b : a);
}

function campoTexto(el, etiqueta){
  const nodo = nodoTexto(el);
  if(!nodo) return document.createDocumentFragment();   // nada editable aquí
  const valor = nodo.textContent.trim();
  const div = document.createElement('div');
  div.className = 'campo';
  const largo = valor.length > 90;
  const id = 'c' + Math.random().toString(36).slice(2,9);
  const tieneMas = el.children.length > 0;
  div.innerHTML = `<label for="${id}">${etiqueta}</label>` +
    (largo ? `<textarea id="${id}"></textarea>` : `<input type="text" id="${id}">`) +
    (tieneMas ? `<div class="contexto">Se ve así en la página: ${el.textContent.trim().slice(0,80)}</div>` : '');
  const entrada = $('#'+id, div);
  entrada.value = valor;
  entrada.addEventListener('input', ()=>{
    // Se conservan los espacios de alrededor para no pegar el texto a lo que sigue
    const antes = nodo.textContent.match(/^\s*/)[0];
    const despues = nodo.textContent.match(/\s*$/)[0];
    nodo.textContent = antes + entrada.value + despues;
    marcarCambio();
  });
  return div;
}

/* ---------------------------------------------------------------
   Eventos (agregar / quitar)
   --------------------------------------------------------------- */
function bloqueEventos(){
  const det = document.createElement('details');
  det.className = 'seccion';
  det.open = true;
  det.innerHTML = `<summary>Eventos y clases especiales</summary><div class="cuerpo"><div id="listaEventos"></div>
    <button class="b-linea" id="btnAgregarEvento">+ Agregar evento</button></div>`;
  $('#btnAgregarEvento', det).addEventListener('click', ()=>{
    agregarEventoAlDoc();
    pintarEventos($('#listaEventos', det));
    marcarCambio();
  });
  pintarEventos($('#listaEventos', det));
  return det;
}

function tarjetasEvento(){
  // Las tarjetas reales del aviso, sin contar el mensaje de "no hay nada"
  return $$('#clases .events-grid .event-card:not([data-vacio])', doc);
}

function pintarEventos(cont){
  cont.innerHTML = '';
  const tarjetas = tarjetasEvento();
  if(!tarjetas.length){
    cont.innerHTML = '<div class="aviso info">No hay eventos. La página mostrará “por ahora no hay nada programado”.</div>';
    return;
  }
  tarjetas.forEach((card, i) => {
    const wrap = document.createElement('div');
    wrap.className = 'evento';
    wrap.style.marginBottom = '1rem';
    const titulo = card.querySelector('h3');
    const texto = card.querySelector('p');
    const caja = card.querySelector('.event-date .box');
    const dia = caja ? caja.querySelector('b') : null;
    const mes = caja ? caja.querySelector('small') : null;
    const hasta = card.getAttribute('data-hasta') || '';
    const destacado = card.classList.contains('evento-destacado');

    wrap.innerHTML = `
      <div class="cabeza"><strong>Evento ${i+1}</strong>
        <button class="b-peligro">Eliminar</button></div>
      <div class="campo"><label>Título</label><input type="text" class="e-titulo"></div>
      <div class="campo"><label>Descripción</label><textarea class="e-texto"></textarea></div>
      <div class="fila">
        <div class="campo"><label>Día (ej. 04)</label><input type="text" class="e-dia" ${destacado?'disabled':''}></div>
        <div class="campo"><label>Mes (ej. Sep)</label><input type="text" class="e-mes" ${destacado?'disabled':''}></div>
      </div>
      <div class="campo"><label>Desaparece solo el (opcional)</label>
        <input type="datetime-local" class="e-hasta">
        <div class="contexto">Hora de Colombia. Déjalo vacío si aún no hay fecha.</div></div>`;

    $('.e-titulo', wrap).value = titulo ? titulo.textContent.trim() : '';
    $('.e-texto', wrap).value = texto ? texto.textContent.trim() : '';
    if(dia) $('.e-dia', wrap).value = dia.textContent.trim();
    if(mes) $('.e-mes', wrap).value = mes.textContent.trim();
    if(hasta) $('.e-hasta', wrap).value = hasta.slice(0,16);

    $('.e-titulo', wrap).addEventListener('input', e => { if(titulo){ titulo.textContent = e.target.value; marcarCambio(); } });
    $('.e-texto', wrap).addEventListener('input', e => { if(texto){ texto.textContent = e.target.value; marcarCambio(); } });
    if(dia) $('.e-dia', wrap).addEventListener('input', e => { dia.textContent = e.target.value; marcarCambio(); });
    if(mes) $('.e-mes', wrap).addEventListener('input', e => { mes.textContent = e.target.value; marcarCambio(); });
    $('.e-hasta', wrap).addEventListener('input', e => {
      // Se guarda siempre con la zona de Colombia para que caduque a la hora correcta
      if(e.target.value) card.setAttribute('data-hasta', e.target.value + ':00-05:00');
      else card.removeAttribute('data-hasta');
      marcarCambio();
    });
    $('.b-peligro', wrap).addEventListener('click', ()=>{
      if(!confirm('¿Eliminar este evento de la página?')) return;
      card.remove();
      pintarEventos(cont);
      marcarCambio();
    });
    cont.appendChild(wrap);
  });
}

function agregarEventoAlDoc(){
  const grid = $('#clases .events-grid', doc);
  const vacio = $('#clases .events-grid [data-vacio]', doc);
  const card = doc.createElement('div');
  card.className = 'event-card';
  card.innerHTML =
    '<div class="event-date"><div class="box"><b>00</b><small>Mes</small></div></div>' +
    '<h3>Nuevo evento</h3>' +
    '<p>Describe aquí el evento.</p>' +
    '<a class="btn btn-sm btn-outline" href="https://wa.me/573138969300" target="_blank" rel="noopener">Más información</a>';
  if(vacio) grid.insertBefore(card, vacio); else grid.appendChild(card);
}

/* ---------------------------------------------------------------
   Fotos de la galería
   --------------------------------------------------------------- */
function bloqueFotos(){
  const det = document.createElement('details');
  det.className = 'seccion';
  det.innerHTML = `<summary>Fotos de la galería</summary>
    <div class="cuerpo">
      <div class="aviso info">Las fotos se achican solas al subirlas, así la página no se vuelve lenta.</div>
      <div class="fotos" id="listaFotos"></div>
    </div>`;
  const cont = $('#listaFotos', det);

  $$('#galeria .gallery-tile img', doc).forEach(img => {
    const ruta = img.getAttribute('src');
    const tarjeta = document.createElement('div');
    tarjeta.className = 'foto';
    const nombre = tarjeta.querySelector ? null : null;
    const idInput = 'f' + Math.random().toString(36).slice(2,9);
    tarjeta.innerHTML = `
      <img src="/${ruta}" alt="">
      <div class="pie">
        <span class="nombre">${ruta.split('/').pop()}</span>
        <label class="subir" for="${idInput}">Cambiar foto</label>
        <input type="file" id="${idInput}" accept="image/*">
      </div>`;
    $('input', tarjeta).addEventListener('change', async e => {
      const archivo = e.target.files[0];
      if(!archivo) return;
      try{
        const { base64, url } = await comprimir(archivo);
        imagenesNuevas.set(ruta, base64);
        $('img', tarjeta).src = url;
        tarjeta.classList.add('cambiada');
        $('.nombre', tarjeta).textContent = ruta.split('/').pop() + ' (nueva)';
        marcarCambio();
      }catch(err){
        alert('No se pudo procesar la imagen: ' + err.message);
      }
    });
    cont.appendChild(tarjeta);
  });
  return det;
}

// Reduce la foto a 1400 px de lado largo y la guarda como WebP.
// Es lo mismo que se hacía a mano antes de subir cada imagen.
function comprimir(archivo){
  return new Promise((resolve, reject) => {
    const lector = new FileReader();
    lector.onerror = () => reject(new Error('no se pudo leer el archivo'));
    lector.onload = () => {
      const img = new Image();
      img.onerror = () => reject(new Error('formato no reconocido'));
      img.onload = () => {
        const max = 1400;
        const escala = Math.min(1, max/Math.max(img.width, img.height));
        const lienzo = document.createElement('canvas');
        lienzo.width = Math.round(img.width*escala);
        lienzo.height = Math.round(img.height*escala);
        lienzo.getContext('2d').drawImage(img, 0, 0, lienzo.width, lienzo.height);
        let calidad = 0.82, url;
        // Bajar calidad hasta quedar por debajo de 300 KB
        for(let i=0;i<4;i++){
          url = lienzo.toDataURL('image/webp', calidad);
          if((url.length*0.75)/1024 < 300) break;
          calidad -= 0.08;
        }
        resolve({ base64: url.split(',')[1], url });
      };
      img.src = lector.result;
    };
    lector.readAsDataURL(archivo);
  });
}

/* ---------------------------------------------------------------
   Guardar
   --------------------------------------------------------------- */
$('#btnGuardar').addEventListener('click', guardar);

async function guardar(){
  const btn = $('#btnGuardar');
  btn.disabled = true;
  $('#estado').textContent = 'Guardando…';
  try{
    // 1) Las fotos primero: si algo falla, la página aún no apunta a ellas
    for(const [ruta, base64] of imagenesNuevas){
      const actual = await api(`${API}/${ruta}?ref=${REPO.rama}`);
      await api(`${API}/${ruta}`, {
        method:'PUT',
        body: JSON.stringify({
          message: `Editor: nueva foto ${ruta.split('/').pop()}`,
          content: base64, sha: actual.sha, branch: REPO.rama
        })
      });
    }
    // 2) La página
    const html = '<!DOCTYPE html>\n' + doc.documentElement.outerHTML;
    await api(`${API}/index.html`, {
      method:'PUT',
      body: JSON.stringify({
        message: 'Editor: cambios de contenido',
        content: aBase64(html), sha: shaIndex, branch: REPO.rama
      })
    });
    imagenesNuevas.clear();
    cambios = false;
    $('#estado').textContent = 'Publicado';
    avisar('Listo. Los cambios estarán visibles en la página en uno o dos minutos.', 'ok');
    await cargarPagina();   // recargar para tener la versión nueva del archivo
  }catch(e){
    btn.disabled = false;
    $('#estado').textContent = 'No se pudo guardar';
    const conflicto = e.message.includes('409') || e.message.includes('does not match');
    avisar(conflicto
      ? 'Alguien más cambió la página mientras editabas. Recarga esta pestaña y vuelve a hacer los cambios.'
      : 'No se pudo guardar.<br><small>'+e.message+'</small>', 'mal');
  }
}

window.addEventListener('beforeunload', e => { if(cambios){ e.preventDefault(); e.returnValue=''; } });

// Si ya hay llave guardada, entrar directo
(function(){
  const guardado = localStorage.getItem('gfc-token');
  if(guardado){ $('#token').value = guardado; entrar(); }
})();
</script>
